version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
    ignore:
      # Every CLI in the fleet uses the same major version of each tool, so a
      # major bump is made for all of them together, not by one repo's bot.
      # TypeScript 7 is a known case: it fails the `tsup --dts` build.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
